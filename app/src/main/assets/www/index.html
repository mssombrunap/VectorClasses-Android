<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vector Classes</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="app">
  <main class="login-page" id="loginPage">
    <section class="brand"><div class="logo-mark"><span class="v">V</span><span class="arrow">↗</span></div><div><div class="vector">VECTOR</div><div class="classes">CLASSES</div></div></section>
    <section class="card login-card"><p class="eyebrow">LEARN • PRACTICE • PROGRESS</p><h1>Welcome to Vector Classes</h1><p class="muted">Sign in with your Vector Classes username.</p><label>Username</label><input id="username" autocomplete="username" placeholder="vectorclassesadmin"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"><button id="loginBtn">Login</button><button class="linkbtn" id="forgotBtn">Forgot password?</button><p id="message" class="message"></p></section>
  </main>
  <main class="dashboard hidden" id="dashboard"><header><section class="mini-brand"><div class="mini-logo">V↗</div><div><b>VECTOR</b><small>CLASSES</small></div></section><button class="ghost" id="logoutBtn">Logout</button></header><section class="welcome"><p class="eyebrow">ADMIN PORTAL</p><h1>Vector Classes Dashboard</h1><p id="adminIdentity" class="muted"></p></section><section class="stats"><article><b>Students</b><strong>—</strong></article><article><b>Courses</b><strong>—</strong></article><article><b>Today's Classes</b><strong>—</strong></article><article><b>Pending Doubts</b><strong>—</strong></article></section><section class="grid"><article class="card"><h2>Add Student</h2><label>Username</label><input id="sUsername" placeholder="ayaan7"><label>Full name</label><input id="sName" placeholder="Student name"><label>Class</label><input id="sClass" placeholder="Class 7"><label>Temporary password</label><input id="sPassword" type="password" placeholder="Minimum 8 characters"><button id="createStudentBtn">Create Student</button><p id="studentMessage" class="message"></p></article><article class="card"><h2>Management</h2><div class="menu"><button>Students</button><button>Courses</button><button>Lectures & Videos</button><button>PDF Resources</button><button>Live Classes</button><button>Tests & Scores</button><button>Assignments</button><button>Announcements</button><button>Student Doubts</button><button>Password Resets</button></div></article></section></main>
</div>
<script src="app.js"></script></body></html>
